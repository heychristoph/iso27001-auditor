# ISO/IEC 27001:2022 (with Amendment 1:2024): requirement identifiers, titles and
# short paraphrases for navigation and reporting.
#
# The authoritative text is copyrighted by ISO and IEC. The summaries below are
# paraphrases, not the official wording. A certification body or consultancy
# holding a license can set `text:` on any requirement with the official wording;
# the report prints `text` when present and falls back to `summary`.
#
# kind: clause  - ISMS requirement (clauses 4 to 10). Always in scope.
# kind: annex   - Annex A reference control. In scope when the Statement of
#                 Applicability marks it applicable.
# surveillance: true  - covered in every surveillance audit (ISO/IEC 17021-1
#                 9.6.2.2 and ISO/IEC 27006-1: internal audit, management review,
#                 nonconformities, changes, objectives, operational control, risk
#                 assessment and Statement of Applicability updates).
# plan: default frequency and nature for a requirement audited directly (a
#       REQ- unit). The auditor confirms them in testplan.csv.

groups:
  "4": Context of the Organization
  "5": Leadership
  "6": Planning
  "7": Support
  "8": Operation
  "9": Performance Evaluation
  "10": Improvement
  "A.5": "Annex A: Organizational Controls"
  "A.6": "Annex A: People Controls"
  "A.7": "Annex A: Physical Controls"
  "A.8": "Annex A: Technological Controls"

requirements:
  # 4 Context of the organization
  - {id: "4.1", kind: clause, group: "4", plan: [annual, manual], title: "Understanding the organization and its context", summary: "The organization determines the external and internal issues relevant to its purpose that affect its ability to achieve the intended outcomes of the ISMS, and determines whether climate change is a relevant issue."}
  - {id: "4.2", kind: clause, group: "4", plan: [annual, manual], title: "Understanding the needs and expectations of interested parties", summary: "The organization determines the interested parties relevant to the ISMS, their relevant requirements (which can include climate-related requirements), and which of those requirements the ISMS will address."}
  - {id: "4.3", kind: clause, group: "4", plan: [annual, manual], title: "Determining the scope of the ISMS", summary: "The boundaries and applicability of the ISMS are determined, considering the issues, the requirements of interested parties, and interfaces and dependencies with other organizations. The scope is available as documented information."}
  - {id: "4.4", kind: clause, group: "4", plan: [annual, manual], title: "Information security management system", summary: "The organization establishes, implements, maintains and continually improves an ISMS, including the processes needed and their interactions."}
  # 5 Leadership
  - {id: "5.1", kind: clause, group: "5", plan: [annual, manual], title: "Leadership and commitment", summary: "Top management demonstrates leadership: policy and objectives fit the strategy, ISMS requirements are integrated into processes, resources are available, the importance of information security is communicated, intended outcomes are achieved, people are directed and supported, and continual improvement is promoted."}
  - {id: "5.2", kind: clause, group: "5", plan: [annual, manual], title: "Policy", summary: "Top management establishes an information security policy suited to the organization's purpose, with objectives or a framework for setting them and commitments to satisfy requirements and to continual improvement. It is documented, communicated within the organization and available to interested parties as appropriate."}
  - {id: "5.3", kind: clause, group: "5", plan: [annual, manual], title: "Organizational roles, responsibilities and authorities", summary: "Top management assigns and communicates responsibilities and authorities for roles relevant to information security, including for ensuring ISMS conformity and for reporting ISMS performance to top management."}
  # 6 Planning
  - {id: "6.1.1", kind: clause, group: "6", plan: [annual, manual], title: "Actions to address risks and opportunities: general", summary: "When planning the ISMS, the organization considers its issues and requirements, determines the risks and opportunities to address, and plans actions, how to integrate them into ISMS processes and how to evaluate their effectiveness."}
  - {id: "6.1.2", kind: clause, group: "6", plan: [annual, manual], title: "Information security risk assessment", summary: "A risk assessment process is defined and applied: it sets risk acceptance criteria and criteria for performing assessments, produces consistent, valid and comparable results, identifies risks to confidentiality, integrity and availability and their owners, analyses consequences and likelihood, and evaluates and prioritizes risks. The process is documented."}
  - {id: "6.1.3", kind: clause, group: "6", surveillance: true, plan: [annual, manual], title: "Information security risk treatment", summary: "A risk treatment process selects treatment options and determines the necessary controls, compares them with Annex A so none are omitted, and produces a Statement of Applicability listing the necessary controls, the justification for including them, whether they are implemented, and the justification for excluding any Annex A control. A treatment plan is formulated, and risk owners approve it and accept the residual risks."}
  - {id: "6.2", kind: clause, group: "6", surveillance: true, plan: [annual, manual], title: "Information security objectives and planning to achieve them", summary: "Information security objectives are set at relevant functions and levels, consistent with the policy, measurable where practicable, monitored, communicated and updated. Plans state what will be done, with what resources, by whom, by when and how results are evaluated."}
  - {id: "6.3", kind: clause, group: "6", surveillance: true, plan: [annual, manual], title: "Planning of changes", summary: "When the organization determines that changes to the ISMS are needed, they are carried out in a planned manner."}
  # 7 Support
  - {id: "7.1", kind: clause, group: "7", plan: [annual, manual], title: "Resources", summary: "The organization determines and provides the resources needed for the ISMS."}
  - {id: "7.2", kind: clause, group: "7", plan: [annual, manual], title: "Competence", summary: "The competence of people whose work affects information security performance is determined and ensured through education, training or experience; actions are taken to acquire missing competence and their effectiveness evaluated; evidence of competence is retained."}
  - {id: "7.3", kind: clause, group: "7", plan: [annual, manual], title: "Awareness", summary: "People working under the organization's control are aware of the information security policy, their contribution to the effectiveness of the ISMS, and the implications of not conforming with ISMS requirements."}
  - {id: "7.4", kind: clause, group: "7", plan: [annual, manual], title: "Communication", summary: "The organization determines the internal and external communications relevant to the ISMS: on what, when, with whom and how."}
  - {id: "7.5.1", kind: clause, group: "7", plan: [continuous, manual], title: "Documented information: general", summary: "The ISMS includes the documented information required by the standard and the documented information the organization determines is necessary for the effectiveness of the ISMS."}
  - {id: "7.5.2", kind: clause, group: "7", plan: [continuous, manual], title: "Creating and updating documented information", summary: "When documented information is created or updated, it is appropriately identified and described, in a suitable format and media, and reviewed and approved for suitability and adequacy."}
  - {id: "7.5.3", kind: clause, group: "7", plan: [continuous, manual], title: "Control of documented information", summary: "Documented information is available and suitable where and when needed and adequately protected. Distribution, access, retrieval, storage, preservation, version control, retention and disposition are addressed, including for documented information of external origin."}
  # 8 Operation
  - {id: "8.1", kind: clause, group: "8", surveillance: true, plan: [continuous, manual], title: "Operational planning and control", summary: "The processes needed to meet requirements and to implement the actions from clause 6 are planned, implemented and controlled against criteria. Documented information shows they were carried out as planned. Planned changes are controlled, unintended changes are reviewed, and externally provided processes, products or services relevant to the ISMS are controlled."}
  - {id: "8.2", kind: clause, group: "8", surveillance: true, plan: [annual, manual], title: "Information security risk assessment", summary: "Information security risk assessments are performed at planned intervals or when significant changes are proposed or occur, and their results are retained."}
  - {id: "8.3", kind: clause, group: "8", surveillance: true, plan: [annual, manual], title: "Information security risk treatment", summary: "The information security risk treatment plan is implemented and the results of risk treatment are retained."}
  # 9 Performance evaluation
  - {id: "9.1", kind: clause, group: "9", surveillance: true, plan: [quarterly, manual], title: "Monitoring, measurement, analysis and evaluation", summary: "The organization determines what is monitored and measured, the methods, when and by whom, and when the results are analysed and evaluated. Evidence of the results is retained, and information security performance and the effectiveness of the ISMS are evaluated."}
  - {id: "9.2.1", kind: clause, group: "9", surveillance: true, plan: [annual, manual], title: "Internal audit: general", summary: "Internal audits at planned intervals show whether the ISMS conforms to the organization's own requirements and to the standard, and whether it is effectively implemented and maintained."}
  - {id: "9.2.2", kind: clause, group: "9", surveillance: true, plan: [annual, manual], title: "Internal audit programme", summary: "An internal audit programme sets frequency, methods, responsibilities, planning requirements and reporting, considering the importance of the processes and previous results. Each audit has defined criteria and scope, auditors are selected to ensure objectivity and impartiality, results are reported to relevant management, and evidence of the programme and results is retained."}
  - {id: "9.3.1", kind: clause, group: "9", surveillance: true, plan: [annual, manual], title: "Management review: general", summary: "Top management reviews the ISMS at planned intervals to ensure its continuing suitability, adequacy and effectiveness."}
  - {id: "9.3.2", kind: clause, group: "9", surveillance: true, plan: [annual, manual], title: "Management review inputs", summary: "The management review considers the status of actions from previous reviews; changes in external and internal issues; changes in the needs and expectations of interested parties; feedback on information security performance, including nonconformities and corrective actions, monitoring and measurement results, audit results and fulfilment of objectives; feedback from interested parties; results of risk assessment and status of the risk treatment plan; and opportunities for continual improvement."}
  - {id: "9.3.3", kind: clause, group: "9", surveillance: true, plan: [annual, manual], title: "Management review results", summary: "The results of the management review include decisions on continual improvement opportunities and any needed changes to the ISMS, and are retained as documented information."}
  # 10 Improvement
  - {id: "10.1", kind: clause, group: "10", surveillance: true, plan: [annual, manual], title: "Continual improvement", summary: "The organization continually improves the suitability, adequacy and effectiveness of the ISMS."}
  - {id: "10.2", kind: clause, group: "10", surveillance: true, plan: [continuous, manual], title: "Nonconformity and corrective action", summary: "When a nonconformity occurs, the organization reacts to control and correct it and deal with its consequences, evaluates the need to eliminate its causes, implements the actions needed, reviews their effectiveness and changes the ISMS if necessary. The nature of nonconformities, the actions taken and their results are documented."}

  # Annex A 5 Organizational controls
  - {id: "A.5.1", kind: annex, group: "A.5", title: "Policies for information security", summary: "An information security policy and topic-specific policies are defined, approved by management, published, communicated to and acknowledged by relevant personnel and interested parties, and reviewed at planned intervals and when significant changes occur."}
  - {id: "A.5.2", kind: annex, group: "A.5", title: "Information security roles and responsibilities", summary: "Information security roles and responsibilities are defined and allocated according to the organization's needs."}
  - {id: "A.5.3", kind: annex, group: "A.5", title: "Segregation of duties", summary: "Conflicting duties and conflicting areas of responsibility are segregated."}
  - {id: "A.5.4", kind: annex, group: "A.5", title: "Management responsibilities", summary: "Management requires all personnel to apply information security in line with the established policy, topic-specific policies and procedures."}
  - {id: "A.5.5", kind: annex, group: "A.5", title: "Contact with authorities", summary: "Contact with relevant authorities is established and maintained."}
  - {id: "A.5.6", kind: annex, group: "A.5", title: "Contact with special interest groups", summary: "Contact with special interest groups, specialist security forums and professional associations is established and maintained."}
  - {id: "A.5.7", kind: annex, group: "A.5", title: "Threat intelligence", summary: "Information about information security threats is collected and analysed to produce threat intelligence."}
  - {id: "A.5.8", kind: annex, group: "A.5", title: "Information security in project management", summary: "Information security is integrated into project management."}
  - {id: "A.5.9", kind: annex, group: "A.5", title: "Inventory of information and other associated assets", summary: "An inventory of information and other associated assets, including their owners, is developed and maintained."}
  - {id: "A.5.10", kind: annex, group: "A.5", title: "Acceptable use of information and other associated assets", summary: "Rules for acceptable use and procedures for handling information and other associated assets are identified, documented and implemented."}
  - {id: "A.5.11", kind: annex, group: "A.5", title: "Return of assets", summary: "Personnel and other interested parties return all organizational assets in their possession when their employment, contract or agreement changes or ends."}
  - {id: "A.5.12", kind: annex, group: "A.5", title: "Classification of information", summary: "Information is classified according to the organization's security needs, based on confidentiality, integrity, availability and relevant interested party requirements."}
  - {id: "A.5.13", kind: annex, group: "A.5", title: "Labelling of information", summary: "Procedures for labelling information are developed and implemented in line with the classification scheme."}
  - {id: "A.5.14", kind: annex, group: "A.5", title: "Information transfer", summary: "Rules, procedures or agreements cover every type of information transfer facility, within the organization and with other parties."}
  - {id: "A.5.15", kind: annex, group: "A.5", title: "Access control", summary: "Rules to control physical and logical access to information and other associated assets are established and implemented based on business and information security requirements."}
  - {id: "A.5.16", kind: annex, group: "A.5", title: "Identity management", summary: "The full life cycle of identities is managed."}
  - {id: "A.5.17", kind: annex, group: "A.5", title: "Authentication information", summary: "Allocation and management of authentication information is controlled by a management process, including advising personnel on its appropriate handling."}
  - {id: "A.5.18", kind: annex, group: "A.5", title: "Access rights", summary: "Access rights to information and other associated assets are provisioned, reviewed, modified and removed in line with the topic-specific policy and rules for access control."}
  - {id: "A.5.19", kind: annex, group: "A.5", title: "Information security in supplier relationships", summary: "Processes and procedures are defined and implemented to manage the information security risks of using suppliers' products or services."}
  - {id: "A.5.20", kind: annex, group: "A.5", title: "Addressing information security within supplier agreements", summary: "Relevant information security requirements are established and agreed with each supplier, based on the type of supplier relationship."}
  - {id: "A.5.21", kind: annex, group: "A.5", title: "Managing information security in the ICT supply chain", summary: "Processes and procedures are defined and implemented to manage the information security risks of the ICT products and services supply chain."}
  - {id: "A.5.22", kind: annex, group: "A.5", title: "Monitoring, review and change management of supplier services", summary: "Changes in supplier information security practices and service delivery are regularly monitored, reviewed, evaluated and managed."}
  - {id: "A.5.23", kind: annex, group: "A.5", title: "Information security for use of cloud services", summary: "Processes for the acquisition, use, management and exit from cloud services are established in line with the organization's information security requirements."}
  - {id: "A.5.24", kind: annex, group: "A.5", title: "Information security incident management planning and preparation", summary: "Information security incident management is planned and prepared for by defining, establishing and communicating processes, roles and responsibilities."}
  - {id: "A.5.25", kind: annex, group: "A.5", title: "Assessment and decision on information security events", summary: "Information security events are assessed and it is decided whether they are categorized as information security incidents."}
  - {id: "A.5.26", kind: annex, group: "A.5", title: "Response to information security incidents", summary: "Information security incidents are responded to in line with documented procedures."}
  - {id: "A.5.27", kind: annex, group: "A.5", title: "Learning from information security incidents", summary: "Knowledge gained from information security incidents is used to strengthen and improve the controls."}
  - {id: "A.5.28", kind: annex, group: "A.5", title: "Collection of evidence", summary: "Procedures are established and implemented for identifying, collecting, acquiring and preserving evidence related to information security events."}
  - {id: "A.5.29", kind: annex, group: "A.5", title: "Information security during disruption", summary: "The organization plans how to maintain information security at an appropriate level during disruption."}
  - {id: "A.5.30", kind: annex, group: "A.5", title: "ICT readiness for business continuity", summary: "ICT readiness is planned, implemented, maintained and tested based on business continuity objectives and ICT continuity requirements."}
  - {id: "A.5.31", kind: annex, group: "A.5", title: "Legal, statutory, regulatory and contractual requirements", summary: "Legal, statutory, regulatory and contractual requirements relevant to information security, and the organization's approach to meeting them, are identified, documented and kept up to date."}
  - {id: "A.5.32", kind: annex, group: "A.5", title: "Intellectual property rights", summary: "Appropriate procedures are implemented to protect intellectual property rights."}
  - {id: "A.5.33", kind: annex, group: "A.5", title: "Protection of records", summary: "Records are protected from loss, destruction, falsification, unauthorized access and unauthorized release."}
  - {id: "A.5.34", kind: annex, group: "A.5", title: "Privacy and protection of PII", summary: "Requirements for preserving privacy and protecting personally identifiable information under applicable laws, regulations and contracts are identified and met."}
  - {id: "A.5.35", kind: annex, group: "A.5", title: "Independent review of information security", summary: "The organization's approach to managing information security, and its implementation, are reviewed independently at planned intervals or when significant changes occur."}
  - {id: "A.5.36", kind: annex, group: "A.5", title: "Compliance with policies, rules and standards for information security", summary: "Compliance with the information security policy, topic-specific policies, rules and standards is regularly reviewed."}
  - {id: "A.5.37", kind: annex, group: "A.5", title: "Documented operating procedures", summary: "Operating procedures for information processing facilities are documented and made available to the personnel who need them."}
  # Annex A 6 People controls
  - {id: "A.6.1", kind: annex, group: "A.6", title: "Screening", summary: "Background verification checks on candidates are carried out before they join and on an ongoing basis, considering applicable laws, regulations and ethics, and proportionate to business requirements, the classification of the information accessed and the perceived risks."}
  - {id: "A.6.2", kind: annex, group: "A.6", title: "Terms and conditions of employment", summary: "Employment contractual agreements state the personnel's and the organization's responsibilities for information security."}
  - {id: "A.6.3", kind: annex, group: "A.6", title: "Information security awareness, education and training", summary: "Personnel and relevant interested parties receive appropriate information security awareness, education and training, and regular updates of the policies and procedures relevant to their job."}
  - {id: "A.6.4", kind: annex, group: "A.6", title: "Disciplinary process", summary: "A disciplinary process is formalized and communicated to act against personnel and other relevant interested parties who have committed an information security policy violation."}
  - {id: "A.6.5", kind: annex, group: "A.6", title: "Responsibilities after termination or change of employment", summary: "Information security responsibilities and duties that remain valid after termination or change of employment are defined, enforced and communicated to the relevant personnel and other interested parties."}
  - {id: "A.6.6", kind: annex, group: "A.6", title: "Confidentiality or non-disclosure agreements", summary: "Confidentiality or non-disclosure agreements reflecting the organization's needs for protecting information are identified, documented, regularly reviewed and signed by personnel and other relevant interested parties."}
  - {id: "A.6.7", kind: annex, group: "A.6", title: "Remote working", summary: "Security measures are implemented when personnel work remotely, to protect information accessed, processed or stored outside the organization's premises."}
  - {id: "A.6.8", kind: annex, group: "A.6", title: "Information security event reporting", summary: "A mechanism lets personnel report observed or suspected information security events through appropriate channels in a timely manner."}
  # Annex A 7 Physical controls
  - {id: "A.7.1", kind: annex, group: "A.7", title: "Physical security perimeters", summary: "Security perimeters are defined and used to protect areas that contain information and other associated assets."}
  - {id: "A.7.2", kind: annex, group: "A.7", title: "Physical entry", summary: "Secure areas are protected by appropriate entry controls and access points."}
  - {id: "A.7.3", kind: annex, group: "A.7", title: "Securing offices, rooms and facilities", summary: "Physical security for offices, rooms and facilities is designed and implemented."}
  - {id: "A.7.4", kind: annex, group: "A.7", title: "Physical security monitoring", summary: "Premises are continuously monitored for unauthorized physical access."}
  - {id: "A.7.5", kind: annex, group: "A.7", title: "Protecting against physical and environmental threats", summary: "Protection against physical and environmental threats, such as natural disasters and other intentional or unintentional threats to infrastructure, is designed and implemented."}
  - {id: "A.7.6", kind: annex, group: "A.7", title: "Working in secure areas", summary: "Security measures for working in secure areas are designed and implemented."}
  - {id: "A.7.7", kind: annex, group: "A.7", title: "Clear desk and clear screen", summary: "Clear desk rules for papers and removable storage media, and clear screen rules for information processing facilities, are defined and appropriately enforced."}
  - {id: "A.7.8", kind: annex, group: "A.7", title: "Equipment siting and protection", summary: "Equipment is sited securely and protected."}
  - {id: "A.7.9", kind: annex, group: "A.7", title: "Security of assets off-premises", summary: "Off-site assets are protected."}
  - {id: "A.7.10", kind: annex, group: "A.7", title: "Storage media", summary: "Storage media are managed through their life cycle of acquisition, use, transportation and disposal in line with the classification scheme and handling requirements."}
  - {id: "A.7.11", kind: annex, group: "A.7", title: "Supporting utilities", summary: "Information processing facilities are protected from power failures and other disruptions caused by failures in supporting utilities."}
  - {id: "A.7.12", kind: annex, group: "A.7", title: "Cabling security", summary: "Cables carrying power, data or supporting information services are protected from interception, interference or damage."}
  - {id: "A.7.13", kind: annex, group: "A.7", title: "Equipment maintenance", summary: "Equipment is maintained correctly to ensure the availability, integrity and confidentiality of information."}
  - {id: "A.7.14", kind: annex, group: "A.7", title: "Secure disposal or re-use of equipment", summary: "Equipment containing storage media is verified to ensure that sensitive data and licensed software have been removed or securely overwritten before disposal or re-use."}
  # Annex A 8 Technological controls
  - {id: "A.8.1", kind: annex, group: "A.8", title: "User endpoint devices", summary: "Information stored on, processed by or accessible through user endpoint devices is protected."}
  - {id: "A.8.2", kind: annex, group: "A.8", title: "Privileged access rights", summary: "The allocation and use of privileged access rights are restricted and managed."}
  - {id: "A.8.3", kind: annex, group: "A.8", title: "Information access restriction", summary: "Access to information and other associated assets is restricted in line with the topic-specific policy on access control."}
  - {id: "A.8.4", kind: annex, group: "A.8", title: "Access to source code", summary: "Read and write access to source code, development tools and software libraries is appropriately managed."}
  - {id: "A.8.5", kind: annex, group: "A.8", title: "Secure authentication", summary: "Secure authentication technologies and procedures are implemented based on information access restrictions and the topic-specific policy on access control."}
  - {id: "A.8.6", kind: annex, group: "A.8", title: "Capacity management", summary: "The use of resources is monitored and adjusted in line with current and expected capacity requirements."}
  - {id: "A.8.7", kind: annex, group: "A.8", title: "Protection against malware", summary: "Protection against malware is implemented and supported by appropriate user awareness."}
  - {id: "A.8.8", kind: annex, group: "A.8", title: "Management of technical vulnerabilities", summary: "Information about technical vulnerabilities of the information systems in use is obtained, the organization's exposure is evaluated, and appropriate measures are taken."}
  - {id: "A.8.9", kind: annex, group: "A.8", title: "Configuration management", summary: "Configurations, including security configurations, of hardware, software, services and networks are established, documented, implemented, monitored and reviewed."}
  - {id: "A.8.10", kind: annex, group: "A.8", title: "Information deletion", summary: "Information stored in information systems, devices or any other storage media is deleted when no longer required."}
  - {id: "A.8.11", kind: annex, group: "A.8", title: "Data masking", summary: "Data masking is used in line with the topic-specific policy on access control, other related policies and business requirements, taking applicable legislation into account."}
  - {id: "A.8.12", kind: annex, group: "A.8", title: "Data leakage prevention", summary: "Data leakage prevention measures are applied to systems, networks and other devices that process, store or transmit sensitive information."}
  - {id: "A.8.13", kind: annex, group: "A.8", title: "Information backup", summary: "Backup copies of information, software and systems are maintained and regularly tested in line with the agreed topic-specific policy on backup."}
  - {id: "A.8.14", kind: annex, group: "A.8", title: "Redundancy of information processing facilities", summary: "Information processing facilities are implemented with redundancy sufficient to meet availability requirements."}
  - {id: "A.8.15", kind: annex, group: "A.8", title: "Logging", summary: "Logs that record activities, exceptions, faults and other relevant events are produced, stored, protected and analysed."}
  - {id: "A.8.16", kind: annex, group: "A.8", title: "Monitoring activities", summary: "Networks, systems and applications are monitored for anomalous behaviour, and appropriate actions are taken to evaluate potential information security incidents."}
  - {id: "A.8.17", kind: annex, group: "A.8", title: "Clock synchronization", summary: "The clocks of information processing systems are synchronized to approved time sources."}
  - {id: "A.8.18", kind: annex, group: "A.8", title: "Use of privileged utility programs", summary: "The use of utility programs that can override system and application controls is restricted and tightly controlled."}
  - {id: "A.8.19", kind: annex, group: "A.8", title: "Installation of software on operational systems", summary: "Procedures and measures are implemented to securely manage software installation on operational systems."}
  - {id: "A.8.20", kind: annex, group: "A.8", title: "Networks security", summary: "Networks and network devices are secured, managed and controlled to protect information in systems and applications."}
  - {id: "A.8.21", kind: annex, group: "A.8", title: "Security of network services", summary: "Security mechanisms, service levels and service requirements of network services are identified, implemented and monitored."}
  - {id: "A.8.22", kind: annex, group: "A.8", title: "Segregation of networks", summary: "Groups of information services, users and information systems are segregated in the organization's networks."}
  - {id: "A.8.23", kind: annex, group: "A.8", title: "Web filtering", summary: "Access to external websites is managed to reduce exposure to malicious content."}
  - {id: "A.8.24", kind: annex, group: "A.8", title: "Use of cryptography", summary: "Rules for the effective use of cryptography, including cryptographic key management, are defined and implemented."}
  - {id: "A.8.25", kind: annex, group: "A.8", title: "Secure development life cycle", summary: "Rules for the secure development of software and systems are established and applied."}
  - {id: "A.8.26", kind: annex, group: "A.8", title: "Application security requirements", summary: "Information security requirements are identified, specified and approved when developing or acquiring applications."}
  - {id: "A.8.27", kind: annex, group: "A.8", title: "Secure system architecture and engineering principles", summary: "Principles for engineering secure systems are established, documented, maintained and applied to any information system development activities."}
  - {id: "A.8.28", kind: annex, group: "A.8", title: "Secure coding", summary: "Secure coding principles are applied to software development."}
  - {id: "A.8.29", kind: annex, group: "A.8", title: "Security testing in development and acceptance", summary: "Security testing processes are defined and implemented in the development life cycle."}
  - {id: "A.8.30", kind: annex, group: "A.8", title: "Outsourced development", summary: "The organization directs, monitors and reviews activities related to outsourced system development."}
  - {id: "A.8.31", kind: annex, group: "A.8", title: "Separation of development, test and production environments", summary: "Development, testing and production environments are separated and secured."}
  - {id: "A.8.32", kind: annex, group: "A.8", title: "Change management", summary: "Changes to information processing facilities and information systems are subject to change management procedures."}
  - {id: "A.8.33", kind: annex, group: "A.8", title: "Test information", summary: "Test information is appropriately selected, protected and managed."}
  - {id: "A.8.34", kind: annex, group: "A.8", title: "Protection of information systems during audit testing", summary: "Audit tests and other assurance activities that assess operational systems are planned and agreed between the tester and appropriate management."}

# Default sample sizes for audits that review records over a period (Stage 2,
# surveillance, recertification). ISO 19011:2018 (A.6) leaves sample sizes to the
# auditor's judgment of risk, population and confidence; these are common, fairly
# conservative starting points, not a standard. Replace them with your own
# methodology; `iso27001.py sample` reads this file every run.

# Activities that happen on a fixed schedule. The population is the set of
# occurrences in the records period (e.g. every month), generated by the script.
periodic:
  annual: 1
  semiannual: 2
  quarterly: 2
  monthly: 2
  weekly: 5
  daily: 25
  multiple-daily: 40

# Activities that happen when something occurs (a hire, a change, an incident).
# The population comes from a population file in the bundle. The first row whose
# `max_population` is >= the population size applies; `all` tests every item.
event:
  - {max_population: 5, size: all}
  - {max_population: 25, size: 5}
  - {max_population: 100, size: 10}
  - {max_population: 250, size: 15}
  - {max_population: null, size: 25}

# Automated and continuous controls, and requirements met by a standing document
# or configuration: inspect one instance. For automated controls this relies on
# effective change management (A.8.32) and access control (A.5.15 to A.5.18).
automated: 1

# Stage 1 reviews documentation and readiness: one item per unit.
stage1: 1
